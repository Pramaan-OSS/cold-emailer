      PRAMAAN_CONNECTOR_RETURN_URL: ${PRAMAAN_CONNECTOR_RETURN_URL:-}
      PRAMAAN_ENTERPRISE_REDIRECT_URI: ${PRAMAAN_ENTERPRISE_REDIRECT_URI:-}
    volumes:
    - ${COLD_EMAIL_BLOBS:-blobs}:/data/blobs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - wget
      - --no-verbose
      - --tries=1
      - --spider
      - http://localhost:8080/health
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
  forms:
    restart: unless-stopped
    image: cold-email/forms:local
    build:
      context: .
      dockerfile: deploy/docker/forms.Dockerfile
      args:
        VERSION: ${COLD_EMAIL_BUILD_VERSION:-}
        COMMIT: ${COLD_EMAIL_BUILD_COMMIT:-}
        BUILT_AT: ${COLD_EMAIL_BUILD_TIME:-}
    ports:
    - ${FORMS_PORT:-8090}:8090
    environment:
      GIN_MODE: release
      FORMS_PORT: '8090'
      FORM_IP_RATE_LIMIT: ${FORM_IP_RATE_LIMIT:-}
      TRUSTED_PROXIES: ${FORMS_TRUSTED_PROXIES:-}
      BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://backend:8080}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-local-dev-internal-token}
      APP_ENV: ${APP_ENV:-dev}
