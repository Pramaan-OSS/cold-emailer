      TRACKING_HOST: 0.0.0.0
      TRACKING_PORT: '3000'
      EVENTBUS_PROVIDER: ${EVENTBUS_PROVIDER:-nats}
      NATS_URL: ${NATS_URL:-nats://nats:4222}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-}
      KAFKA_TRACKING_TOPIC: ${KAFKA_TRACKING_TOPIC:-tracking-events}
      TRACKING_RATE_LIMIT_PER_MIN: ${TRACKING_RATE_LIMIT_PER_MIN:-}
      TRACKING_PAGEHIT_RATE_LIMIT_PER_MIN: ${TRACKING_PAGEHIT_RATE_LIMIT_PER_MIN:-}
      TRACKING_TRUSTED_PROXIES: ${TRACKING_TRUSTED_PROXIES:-}
      TRACKING_CLIENT_IP_HEADER: ${TRACKING_CLIENT_IP_HEADER:-}
      TRACKING_SCANNER_BUILTINS: ${TRACKING_SCANNER_BUILTINS:-}
      TRACKING_SCANNER_NETWORKS: ${TRACKING_SCANNER_NETWORKS:-}
      TRACKING_SCANNER_CLICK_NETWORKS: ${TRACKING_SCANNER_CLICK_NETWORKS:-}
      TRACKING_SCANNER_ASN_HEADER: ${TRACKING_SCANNER_ASN_HEADER:-}
      TRACKING_SCANNER_ASN_DB: ${TRACKING_SCANNER_ASN_DB:-}
      TRACKING_SCANNER_ASN_DB_URL: ${TRACKING_SCANNER_ASN_DB_URL:-}
      TRACKING_IP_HASH_KEY: ${TRACKING_IP_HASH_KEY:-}
      BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://backend:8080}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-local-dev-internal-token}
    extra_hosts:
    - host.docker.internal:host-gateway
    depends_on:
      nats:
        condition: service_healthy
  realtime:
    restart: unless-stopped
    image: cold-email/realtime:local
    build:
      context: .
      dockerfile: deploy/docker/realtime.Dockerfile
    ports:
    - 4000:4000
    environment:
      PHX_HOST: ${PHX_HOST:-${PUBLIC_HOST:-localhost}}
      PORT: 4000
      DATABASE_URL: ${PRIMARY_DB:-postgres://coldemail:coldemail@postgres:5432/coldemail_dev?sslmode=disable}
      DATABASE_SSL: ${DATABASE_SSL:-false}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-10}
      REDIS_URL: ${REDIS:-redis://redis:6379}
      JWT_SECRET: ${AUTH_SECRET:-local-dev-auth-secret-minimum-32-characters-long}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-local-development-secret-key-base-minimum-64-characters-for-phoenix}
      CHECK_ORIGIN_HOSTS: ${CHECK_ORIGIN_HOSTS:-}
      CHECK_ORIGIN: ${CHECK_ORIGIN:-false}
      APP_ENV: ${APP_ENV:-dev}
    env_file:
    - path: .env
      required: false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  web:
    restart: unless-stopped
    image: cold-email/web:local
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
    - 5173:80
    environment:
      COLD_EMAIL_API_URL: ${API_PUBLIC_URL:-http://${PUBLIC_HOST:-localhost}:8080}
      COLD_EMAIL_APP_URL: ${APP_URL:-http://${PUBLIC_HOST:-localhost}:5173}
      COLD_EMAIL_COMPANY_LOGOS: ${COLD_EMAIL_COMPANY_LOGOS:-}
    depends_on:
      backend:
        condition: service_healthy
  admin:
    restart: unless-stopped
    image: cold-email/admin:local
    build:
      context: .
      dockerfile: admin/Dockerfile
    ports:
    - 5174:80
    environment:
      COLD_EMAIL_API_URL: ${API_PUBLIC_URL:-http://${PUBLIC_HOST:-localhost}:8080}
      COLD_EMAIL_DASHBOARD_URL: ${APP_URL:-http://${PUBLIC_HOST:-localhost}:5173}
      COLD_EMAIL_ENV_LABEL: ${ENV_LABEL:-development}
    depends_on:
      backend:
        condition: service_healthy
volumes:
  postgres_data: null
  redis_data: null
  nats_data: null
  blobs: null
  worker_state: null
  updater_state: null
