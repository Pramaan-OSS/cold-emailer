name: Local template checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web typecheck
      - run: pnpm --dir web test:run --maxWorkers=4
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: coldemail
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: coldemail
        ports: [5432:5432]
        options: >-
          --health-cmd="pg_isready -U coldemail"
          --health-interval=5s --health-timeout=5s --health-retries=10
    env:
      PRIMARY_DB: postgres://coldemail:local-test-only@localhost:5432/coldemail?sslmode=disable
      COLD_EMAIL_TEST_DB: postgres://coldemail:local-test-only@localhost:5432/coldemail?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go run ./cmd/migrate
      - run: >-
          go test -p 1 ./internal/repository ./internal/app/analytics ./internal/scheduler ./internal/tasks ./internal/app/orgtransfer
          -run 'TestLive(AccountStatusPage|WarmupPartner|WarmupDispatch|VerificationBacklog|Dashboard|Task|MailboxSend|BookedSends|ArrivalDiagnostics|EmailMessageMap|UnknownResolution|DefinitiveConflict|SendRecoveryResolution|UnstartedDispatch|PriorDefinitive|AuthenticationRepair|ConcurrentAuthentication|ExpandedConflict|ImportOverwrites|JobRun|Monitoring|ParkedCampaign|ClaimedMailbox|CampaignsSharing|LostMailbox)'
          -count=1
